; PlatformIO Project Configuration File
; F_test_VE - FreeRTOS 点灯 (STM32F103VET6, CubeMX 生成 + GCC 移植层)

[env:genericSTM32F103VE]
platform = ststm32
board = genericSTM32F103VE
framework = stm32cube

; 头文件搜索路径
; 注意: stm32cube 框架会自动编译 Core/ 和 Drivers/ 的 HAL 源码,
;       这里只需声明 include 路径
build_flags =
    -ICore/Inc
    -Ilib/FreeRTOS/include
    -Ilib/FreeRTOS/CMSIS_RTOS_V2
    -Ilib/FreeRTOS/portable/GCC/ARM_CM3
    -Ilib/ZDT_EmmV5/inc

; ST-Link 下载 + 调试配置
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
